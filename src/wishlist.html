<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>TheList</title>
    <link rel="stylesheet" href="wishlist.css" />
  </head>
  <body>
    <div class="topbar">
      <!-- Menu déroulant maison : un <select> ne se met pas à la charte (le
           navigateur impose son propre panneau) et n'affiche pas les compteurs. -->
      <div class="dd" id="section">
        <button class="dd-btn" id="section-btn" type="button" aria-haspopup="listbox" aria-expanded="false">
          <span id="section-label">PRODUITS</span><span class="dd-caret" aria-hidden="true">▾</span>
        </button>
        <div class="dd-panel" id="section-panel" role="listbox" hidden></div>
      </div>
      <div class="dd" id="cats">
        <button class="dd-btn" id="cats-btn" type="button" aria-haspopup="listbox" aria-expanded="false">
          <span id="cats-label">TOUT</span><span class="dd-caret" aria-hidden="true">▾</span>
        </button>
        <div class="dd-panel" id="cats-panel" role="listbox" hidden></div>
      </div>
      <span class="sep" aria-hidden="true"></span>
      <span class="total" id="total"></span>
      <div class="dd right" id="lang">
        <button class="dd-btn" id="lang-btn" type="button" aria-haspopup="listbox" aria-expanded="false">
          <span id="lang-label">FR</span><span class="dd-caret" aria-hidden="true">▾</span>
        </button>
        <div class="dd-panel" id="lang-panel" role="listbox" hidden></div>
      </div>
      <div class="dd right" id="keys">
        <button class="mute" id="keys-btn" type="button" aria-haspopup="true" aria-expanded="false" title="Raccourcis clavier">⌘</button>
        <div class="dd-panel wide" id="keys-panel" hidden></div>
      </div>
      <button class="mute" id="mute" type="button" aria-pressed="false" title="Couper le son">♪</button>
    </div>
    <main id="grid" class="grid"></main>
    <script type="module" src="wishlist.js"></script>
  </body>
</html>
