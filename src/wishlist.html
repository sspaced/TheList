<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TheList</title>
    <link rel="stylesheet" href="wishlist.css" />
  </head>
  <body>
    <div class="topbar">
      <!-- Home-made dropdown: a <select> cannot be styled to the theme (the
           browser imposes its own panel) and cannot show the counters.
           Every label below is left EMPTY on purpose: i18n paints them on load,
           and a hard-coded fallback would flash the wrong language. -->
      <div class="dd" id="section">
        <button class="dd-btn" id="section-btn" type="button" aria-haspopup="listbox" aria-expanded="false">
          <span id="section-label"></span><span class="dd-caret" aria-hidden="true">▾</span>
        </button>
        <div class="dd-panel" id="section-panel" role="listbox" hidden></div>
      </div>
      <div class="dd" id="cats">
        <button class="dd-btn" id="cats-btn" type="button" aria-haspopup="listbox" aria-expanded="false">
          <span id="cats-label"></span><span class="dd-caret" aria-hidden="true">▾</span>
        </button>
        <div class="dd-panel" id="cats-panel" role="listbox" hidden></div>
      </div>
      <span class="sep" aria-hidden="true"></span>
      <input class="q" id="q" type="search" autocomplete="off" spellcheck="false" />
      <span class="sep" aria-hidden="true"></span>
      <span class="total" id="total"></span>
      <div class="dd right" id="lang">
        <button class="dd-btn" id="lang-btn" type="button" aria-haspopup="listbox" aria-expanded="false">
          <span id="lang-label"></span><span class="dd-caret" aria-hidden="true">▾</span>
        </button>
        <div class="dd-panel" id="lang-panel" role="listbox" hidden></div>
      </div>
      <div class="dd right" id="keys">
        <button class="mute" id="keys-btn" type="button" aria-haspopup="true" aria-expanded="false">⌘</button>
        <div class="dd-panel wide" id="keys-panel" hidden></div>
      </div>
      <button class="mute" id="mute" type="button" aria-pressed="false">♪</button>
    </div>
    <main id="grid" class="grid"></main>
    <script type="module" src="wishlist.js"></script>
  </body>
</html>
